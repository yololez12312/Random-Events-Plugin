```yaml
name: Build RandomWorldEvents

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        shell: bash
        run: |
          ZIP=$(find . -type f -name 'RandomWorldEvents-Source.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: RandomWorldEvents-Source.zip not found."
            find . -maxdepth 4 -type f
            exit 1
          fi

          mkdir -p buildsrc
          unzip -o "$ZIP" -d buildsrc

          PY

      - name: Build plugin
        shell: bash
        run: |
          POM=$(find buildsrc -type f -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: No pom.xml found."
            exit 1
          fi

          echo "Building: $POM"
          mvn -B -ntp -f "$POM" clean package
        timeout-minutes: 10

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomWorldEvents
          path: buildsrc/**/target/*.jar
          if-no-files-found: error
```
